{% macro icon(name, class_name='icon') -%}
<svg class="{{ class_name }}" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
{% if name == 'water' %}<path d="M12 3c-3 4-6 7-6 11a6 6 0 0 0 12 0c0-4-3-7-6-11Z"/><path d="M9 15a3 3 0 0 0 3 3"/>
{% elif name == 'moon' %}<path d="M20 14A8 8 0 0 1 10 4a8 8 0 1 0 10 10Z"/>
{% elif name == 'move' %}<path d="m5 18 6-6 3 3 5-8M14 7h5v5"/><path d="M4 6h5M4 10h3"/>
{% elif name == 'calm' %}<path d="M3 9h10a3 3 0 1 0-3-3M3 13h15a3 3 0 1 1-3 3M3 17h5"/>
{% elif name == 'focus' %}<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/><path d="m14 10 6-6"/>
{% elif name == 'sun' %}<circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5M17.5 17.5 19 19M19 5l-1.5 1.5M6.5 17.5 5 19"/>
{% elif name == 'chart' %}<path d="M4 4v16h16M8 16v-4m4 4V8m4 8V5"/>
{% elif name == 'journal' %}<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h3M3 7h4M3 12h4M3 17h4"/>
{% elif name == 'check' %}<path d="m5 12 4 4 10-10"/>
{% elif name == 'grid' %}<rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/>
{% else %}<path d="M5 12h14m-5-5 5 5-5 5"/>{% endif %}
</svg>
{%- endmacro %}
