name: vitalilab-study-ega1026
services:
  db:
    image: postgres:18-alpine
    container_name: vitalilab-study-db-ega1026
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    shm_size: 64m
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: vitalilab_estudio_ega1026
      POSTGRES_USER: study_owner
      POSTGRES_PASSWORD_FILE: /run/secrets/owner_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    secrets:
      - owner_password
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/tls/server.crt
      - -c
      - ssl_key_file=/tls/server.key
      - -c
      - max_connections=15
      - -c
      - shared_buffers=64MB
      - -c
      - work_mem=2MB
      - -c
      - temp_file_limit=65536
    ports:
      - 127.0.0.1:55432:5432
    volumes:
      - study_data:/var/lib/postgresql
      - ./tls:/tls:ro
    networks:
      - study_private
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U study_owner -d vitalilab_estudio_ega1026"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
secrets:
  owner_password:
    file: ./secrets/owner_password
volumes:
  study_data:
networks:
  study_private:
    internal: true
