name: CI

on:
  pull_request:
    branches: [staging, main]
  push:
    branches: [staging, main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pip install pip-audit==2.10.1
      - run: python -m ruff check app tests wsgi.py scripts migrations/versions
      - run: python -m ruff format --check app tests wsgi.py scripts migrations/versions
      - name: Security static analysis
        run: python -m bandit -q -r app scripts wsgi.py -ll
      - run: python -m pytest
      - run: python -m pip_audit -r requirements.txt --progress-spinner off
      - name: Validate isolated deployment configuration
        env:
          RELEASE_SHA: ${{ github.sha }}
          POSTGRES_ADMIN_PASSWORD: ci-only-placeholder
          POSTGRES_APP_PASSWORD: ci-only-placeholder
          SECRET_KEY: ci-only-placeholder
        run: |
          for script in deploy/nexostack/*.sh; do bash -n "$script"; done
          docker compose -f deploy/nexostack/compose.yaml config --quiet
          sudo visudo -c -f deploy/nexostack/vitalilab.sudoers

  postgres-migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: vitalilab_test
          POSTGRES_USER: vitalilab
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vitalilab -d vitalilab_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      APP_ENV: development
      SECRET_KEY: ci-only-secret
      DATABASE_URL: postgresql://vitalilab:test-only-password@localhost:5432/vitalilab_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m flask --app wsgi:app db upgrade
      - run: python -m flask --app wsgi:app seed-habits
      - run: python -m scripts.verify_postgres_release
      - run: python -m flask --app wsgi:app db check
      - name: Prove PostgreSQL backup and isolated restore
        shell: bash
        run: |
          POSTGRES_CONTAINER="$(docker ps --filter 'ancestor=postgres:18-alpine' --format '{{.ID}}' | head -n 1)"
          test -n "$POSTGRES_CONTAINER"
          docker exec "$POSTGRES_CONTAINER" pg_dump \
            --username vitalilab \
            --dbname vitalilab_test \
            --format custom \
            --file /tmp/vitalilab.dump
          docker exec "$POSTGRES_CONTAINER" createdb \
            --username vitalilab \
            vitalilab_restore
          docker exec "$POSTGRES_CONTAINER" pg_restore \
            --username vitalilab \
            --dbname vitalilab_restore \
            --exit-on-error \
            /tmp/vitalilab.dump
          SOURCE_HABITS="$(docker exec "$POSTGRES_CONTAINER" psql --username vitalilab --dbname vitalilab_test --tuples-only --no-align --command 'SELECT COUNT(*) FROM habits')"
          RESTORED_HABITS="$(docker exec "$POSTGRES_CONTAINER" psql --username vitalilab --dbname vitalilab_restore --tuples-only --no-align --command 'SELECT COUNT(*) FROM habits')"
          test "$SOURCE_HABITS" = "$RESTORED_HABITS"
          QUERY="SELECT 'users', count(*) FROM users UNION ALL SELECT 'user_profiles', count(*) FROM user_profiles UNION ALL SELECT 'health_measurements', count(*) FROM health_measurements UNION ALL SELECT 'habits', count(*) FROM habits UNION ALL SELECT 'habit_entries', count(*) FROM habit_entries UNION ALL SELECT 'announcements', count(*) FROM announcements UNION ALL SELECT 'audit_events', count(*) FROM audit_events UNION ALL SELECT 'user_goals', count(*) FROM user_goals UNION ALL SELECT 'daily_checkins', count(*) FROM daily_checkins UNION ALL SELECT 'schools', count(*) FROM schools UNION ALL SELECT 'school_groups', count(*) FROM school_groups UNION ALL SELECT 'school_memberships', count(*) FROM school_memberships UNION ALL SELECT 'teacher_group_assignments', count(*) FROM teacher_group_assignments UNION ALL SELECT 'routine_completions', count(*) FROM routine_completions"
          SOURCE_COUNTS="$(docker exec "$POSTGRES_CONTAINER" psql --username vitalilab --dbname vitalilab_test --tuples-only --no-align --command "$QUERY")"
          RESTORED_COUNTS="$(docker exec "$POSTGRES_CONTAINER" psql --username vitalilab --dbname vitalilab_restore --tuples-only --no-align --command "$QUERY")"
          test "$SOURCE_COUNTS" = "$RESTORED_COUNTS"
          test "$(docker exec "$POSTGRES_CONTAINER" psql --username vitalilab --dbname vitalilab_restore --tuples-only --no-align --command 'SELECT COUNT(*) FROM alembic_version')" = "1"
      - name: Verify restored schema has no model drift
        env:
          DATABASE_URL: postgresql://vitalilab:test-only-password@localhost:5432/vitalilab_restore
        run: python -m flask --app wsgi:app db check

  container-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build production container
        run: docker build --tag vitalilab:${{ github.sha }} .
